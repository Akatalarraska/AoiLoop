include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Missing localization is a product defect, not a style nit.
    missing_required_param: error
    missing_return: error
    # Treat dead code and unused members as errors so they never accumulate.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # `TODO` comments are allowed; the roadmap is long.
    todo: ignore

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "lib/l10n/generated/**"
    - "build/**"
    - ".dart_tool/**"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # --- Correctness -------------------------------------------------------
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # --- Immutability / architecture --------------------------------------
    prefer_final_locals: true
    prefer_final_in_for_each: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_setters_without_getters: true

    # --- Readability -------------------------------------------------------
    directives_ordering: true
    sort_pub_dependencies: true
    require_trailing_commas: true
    unawaited_futures: true
    use_super_parameters: true

    # --- Health / product-specific ----------------------------------------
    # User-visible strings must go through AppLocalizations (see l10n.yaml).
    # This rule is the mechanical half of that guarantee.
    public_member_api_docs: false

    # Relaxed on purpose: `print` is caught by avoid_print from flutter_lints.
    lines_longer_than_80_chars: false
