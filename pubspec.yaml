name: blauloop
description: >-
  BlauLoop — organisation, maintenance and logistics for Type 1 Diabetes
  devices and consumables. Offline-first. Not a dosing or treatment tool.
publish_to: "none"

# Pre-MVP. The roadmap targets 0.1.0 at the end of Phase 10.
version: 0.1.0-dev+1

environment:
  sdk: ^3.13.0

dependencies:
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  flutter_timezone: ^5.1.0
  go_router: ^17.5.0
  intl: any
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.0
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  sqlite3: ^3.5.1
  test: ^1.31.1

flutter:
  uses-material-design: true
  generate: true
