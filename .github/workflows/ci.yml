name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel a superseded run rather than burning minutes on a stale commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated sources are not committed (see .gitignore), so CI produces
      # them the same way a contributor does. This also proves the generators
      # still run against the pinned dependency set.
      - name: Generate localizations
        run: flutter gen-l10n

      # gen-l10n writes a JSON map of locale -> missing keys, and writes `{}`
      # when everything is translated. So this checks the map is empty rather
      # than the file being zero bytes.
      - name: Fail on missing translations
        run: |
          if [ ! -f l10n_untranslated.txt ]; then
            echo "All locales are complete."
            exit 0
          fi
          if [ "$(jq 'length' l10n_untranslated.txt)" != "0" ]; then
            echo "::error::Some strings are missing a translation:"
            cat l10n_untranslated.txt
            exit 1
          fi
          echo "All locales are complete."

      - name: Run code generation
        run: dart run build_runner build

      # Only committed sources are checked, so generated output cannot fail
      # the format gate over a generator's own style choices.
      - name: Check formatting
        run: |
          git ls-files '*.dart' -z \
            | xargs -0 dart format --output=none --set-exit-if-changed

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      # Debug rather than release: no signing keys live in this repository,
      # and the point here is to catch a broken Gradle or plugin setup.
      - name: Build debug APK
        run: flutter build apk --debug

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    timeout-minutes: 40
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n
      - run: dart run build_runner build

      - name: Build iOS
        run: flutter build ios --debug --no-codesign
